version: '3.8'

services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse_analytics
    ports:
      - "8123:8123" # HTTP API (used by backend)
      - "9000:9000" # Native TCP Client (used by DBeaver/CLI if native port is selected)
    environment:
      - CLICKHOUSE_USER=tracker
      - CLICKHOUSE_PASSWORD=tracker123
      - CLICKHOUSE_DB=analytics
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse
    restart: always

volumes:
  clickhouse_data:
  clickhouse_logs:
